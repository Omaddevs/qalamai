# Behind the shared Caddy (TLS). One origin: static app + /api + public Link-in-Bio pages.

# Language version of a prerendered page: /narxlar?lang=ru → narxlar.ru.html (Uzbek is the bare file).
map $arg_lang $lang_suffix {
  default "";
  uz-cyrl ".uz-cyrl";
  ru ".ru";
  en ".en";
  kk ".kk";
  ky ".ky";
  tg ".tg";
  zh ".zh";
  hi ".hi";
  es ".es";
  fr ".fr";
  ar ".ar";
  bn ".bn";
  pt ".pt";
  ur ".ur";
  id ".id";
  de ".de";
  ja ".ja";
  tr ".tr";
  ko ".ko";
  vi ".vi";
  it ".it";
  fa ".fa";
  pl ".pl";
  uk ".uk";
}

server {
  listen 80;
  server_name _;
  # Redirects stay relative: TLS ends at Caddy, so nginx would otherwise send http:// addresses
  absolute_redirect off;
  root /usr/share/nginx/html;

  # Premium uploads go up to 200 MB
  client_max_body_size 210m;

  location ~ ^/(api|b)/ {
    proxy_pass http://api:4000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    proxy_request_buffering off;
    proxy_read_timeout 330s; # jobs long-poll and run up to JOB_TIMEOUT_SEC
    proxy_send_timeout 330s;
  }

  # Google Search Console verification file — set from the admin panel, served by the API
  location ~ ^/google[0-9a-f]+\.html$ {
    proxy_pass http://api:4000;
    proxy_set_header Host $host;
  }

  # The admin panel is never indexed
  location = /admin {
    add_header Cache-Control "no-cache";
    add_header X-Robots-Tag "noindex, nofollow";
    try_files /index.html =404;
  }

  # Shared presentations (/v/<id>): a user's own work, open to whoever has the link, never indexed
  location ~ "^/v/[A-Za-z0-9_-]{8,40}/?$" {
    add_header Cache-Control "no-cache";
    add_header X-Robots-Tag "noindex, nofollow";
    try_files /index.html =404;
  }

  # One address per page: /index.html → /, /narxlar.html (or narxlar.ru.html) → /narxlar
  location = /index.html {
    return 301 /$is_args$args;
  }

  # The landing, in the language ?lang= asks for
  location = / {
    add_header Cache-Control "no-cache";
    # both are files served right here ("=404" last: a bare "/index.html" would be an internal
    # redirect into the 301 above and loop)
    try_files /index$lang_suffix.html /index.html =404;
  }

  # Unknown addresses answer 404 (not the landing with 200), showing the app's "page not found"
  error_page 404 /404.html;
  location = /404.html {
    internal;
    add_header Cache-Control "no-cache";
    add_header X-Robots-Tag "noindex";
  }

  # Hashed build files never change
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    error_page 404 = @missing;
    try_files $uri =404;

    # pdf.js ships its worker as .mjs, which nginx's mime.types doesn't list. Served as
    # application/octet-stream (with nosniff), the browser refuses to run it and the
    # PDF editor can't open any PDF.
    location ~ \.mjs$ {
      types { }
      default_type text/javascript;
      add_header Cache-Control "public, max-age=31536000, immutable";
      try_files $uri =404;
    }
  }

  # pdf.js data (fonts, character maps, wasm decoders) and the background-removal model, read by
  # the browser's tool worker. A missing file must be a 404 — never index.html — so a tool can fall
  # back to the server instead of choking on HTML.
  location ~ ^/(pdfjs|models)/ {
    add_header Cache-Control "public, max-age=604800";
    error_page 404 = @missing;
    try_files $uri =404;
  }

  # A missing file under /assets, /pdfjs, /models: a bare 404, not the "page not found" HTML
  location @missing {
    return 404 "";
  }

  # The app itself: always revalidate, so a deploy shows up at once
  # drawn profile avatars (public/avatars/NN.webp)
  location /avatars/ {
    add_header Cache-Control "public, max-age=2592000";
    try_files $uri =404;
  }

  # Public pages (/narxlar, /vositalar/pdf-dan-word …) are prerendered as narxlar.html, narxlar.ru.html …;
  # "/narxlar/" → "/narxlar". Anything else is a 404.
  location / {
    rewrite ^(/[^.]+?)/+$ $1 permanent;
    rewrite ^(/[^.]+?)\.(uz-cyrl|ru|en|kk|ky|tg|zh|hi|es|fr|ar|bn|pt|ur|id|de|ja|tr|ko|vi|it|fa|pl|uk)\.html$ $1?lang=$2 permanent;
    rewrite ^(/[^.]+?)\.html$ $1 permanent;
    add_header Cache-Control "no-cache";
    try_files $uri $uri$lang_suffix.html $uri.html =404;
  }
}
